[env:wt32-sc01-plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

# Librerie necessarie
lib_deps =
    lvgl/lvgl@^8.3.0
    evert/ELMduino@^3.0.0
    ArduinoJson/ArduinoJson@^6.21.3
    PubSubClient/PubSubClient@^2.8.0
    SD/SD@^2.0.0
    FS/FS@^2.0.0

# Definizioni del compilatore
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLVGL_CONF_INCLUDE_SIMPLE
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=0

# Monitor con filtri
monitor_filters = 
    esp32_exception_decoder
    colorize

# Impostazioni seriali
monitor_rts = 0
monitor_dtr = 0

# Ottimizzazione
build_type = release